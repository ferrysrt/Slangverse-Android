name: Refresh normalized slang dataset
on:
  workflow_dispatch:
    inputs:
      query:
        description: 'Optional Firecrawl search query; the default embeds the current UTC date and names tiktok/twitter/instagram (one search, 40 results, at least 10 pages required)'
        type: string
        default: ''
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: write
concurrency:
  group: slang-candidate-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dataset and historical compatibility contracts before paid requests
        working-directory: backend
        run: node --test test/dataset-refresh.test.mjs test/dataset-curate.test.mjs test/dataset-normalized.test.mjs test/catalog.test.mjs
      - name: Discover candidate slang via one Firecrawl search and one normalization request
        working-directory: backend
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-6-luna' }}
          FIRECRAWL_QUERY: ${{ inputs.query }}
          # Relative to this step's working-directory (backend/), so the audit
          # evidence lands in backend/dataset-runs at the repository root.
          DATASET_AUDIT_DIR: dataset-runs
        run: npm run dataset:refresh
      - name: Publish normalized dataset and run evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: normalized-slang-dataset-${{ github.run_id }}
          path: |
            backend/data/discovered_candidates.json
            backend/data/discovered_candidates.csv
            backend/dataset-runs/
          if-no-files-found: warn
      - name: Persist normalized dataset, source captures and audit evidence
        if: ${{ always() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/data/discovered_candidates.json backend/data/discovered_candidates.csv backend/dataset-runs/
          if git diff --cached --quiet; then exit 0; fi
          GIT_EDITOR=true git commit -m 'Refresh normalized slang dataset'
          GIT_EDITOR=true git pull --rebase origin main
          git push origin HEAD:main

