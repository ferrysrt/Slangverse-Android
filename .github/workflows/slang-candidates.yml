name: Refresh normalized slang dataset
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Replay an archived capture without providers, or collect fresh glossaries from Firecrawl'
        type: choice
        options:
          - replay
          - live
        default: replay
      query:
        description: 'Optional Firecrawl search query in live mode'
        type: string
        default: ''
  schedule:
    - cron: '0 3 * * 1'
permissions:
  contents: read
concurrency:
  group: slang-candidate-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test dataset extraction and compatibility
        working-directory: backend
        run: node --test test/research-admin.test.mjs test/dataset-refresh.test.mjs test/dataset-curate.test.mjs test/dataset-normalized.test.mjs test/catalog.test.mjs
      - name: Save a validated dataset version to Supabase
        working-directory: backend
        env:
          DATASET_MODE: ${{ inputs.mode || 'live' }}
          FIRECRAWL_API_KEY: ${{ inputs.mode != 'replay' && secrets.FIRECRAWL_API_KEY || '' }}
          FIRECRAWL_QUERY: ${{ inputs.query }}
          SLANGVERSE_SUPABASE_URL: ${{ vars.SLANGVERSE_SUPABASE_URL }}
          RESEARCH_WORKER_SUPABASE_KEY: ${{ secrets.RESEARCH_WORKER_SUPABASE_KEY }}
        run: |
          export DATASET_EXPORT_DIR="$RUNNER_TEMP/slangverse-dataset"
          if [[ "$DATASET_MODE" == replay ]]; then
            node dataset/refresh-deterministic.mjs --import --replay dataset-runs/2026-11-18T21-07-05-945Z-066f7cd4-b38f-4e3c-9934-b8bf267ba13b/sources.json
          else
            node dataset/refresh-deterministic.mjs --import
          fi
