name: Publish LLM question bank
on:
  workflow_dispatch:
    inputs:
      maxPacks:
        description: 'Maximum paid requests (each generates ten mixed-slang questions; no retries)'
        default: '1'
        required: true
        type: choice
        options: ['1', '2', '3']
permissions:
  contents: write
concurrency:
  group: publish-question-bank
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate dataset, generation and publication contracts before paid requests
        working-directory: backend
        run: npm test
      - name: Generate bounded mixed-slang packs and record every attempt
        id: generate
        working-directory: backend
        env:
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-6-luna' }}
          LLM_TIMEOUT_MS: '120000'
          LLM_MAX_TOKENS: '10000'
          BANK_MAX_PACKS: ${{ inputs.maxPacks || '1' }}
        run: npm run bank:publish
      - name: Aggregate real experiment records, including failures
        if: ${{ always() && steps.generate.outcome != 'skipped' }}
        working-directory: backend
        run: npm run experiments:report
      - name: Upload experiment evidence and public bank
        if: ${{ always() && steps.generate.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: mixed-question-experiments-${{ github.run_id }}
          path: |
            backend/experiments/
            question-bank/
          if-no-files-found: warn
      - name: Persist audit evidence and valid packs even when an attempt fails
        if: ${{ !cancelled() && steps.generate.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-bank/ backend/experiments/
          if git diff --cached --quiet; then exit 0; fi
          GIT_EDITOR=true git commit -m 'Record mixed generation experiments'
          GIT_EDITOR=true git pull --rebase origin main
          git push origin HEAD:main
