name: Publish LLM question bank
on:
  workflow_dispatch:
    inputs:
      maxPacks:
        description: 'Maximum paid generation requests (1–3, one ten-question pack each)'
        default: '3'
        required: true
        type: choice
        options: ['1', '2', '3']
      force:
        description: 'Regenerate current packs (otherwise only missing/outdated packs)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'backend/data/curated_senses.json'
permissions:
  contents: write
concurrency:
  group: publish-question-bank
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate at most three missing or outdated LLM packs
        working-directory: backend
        env:
          LLM_PROVIDER: openai-compatible
          LLM_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          LLM_MODEL: ${{ vars.OPENROUTER_MODEL || 'openai/gpt-6-luna' }}
          LLM_TIMEOUT_MS: '120000'
          LLM_MAX_TOKENS: '8000'
          LLM_REASONING_EFFORT: low
          LLM_RETRIES: '0'
          BANK_MAX_PACKS: ${{ inputs.maxPacks || '3' }}
          BANK_FORCE: ${{ inputs.force || 'false' }}
        run: node scripts/publish-question-bank.mjs
      - name: Publish valid packs and their catalog together
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question-bank/
          if git diff --cached --quiet; then exit 0; fi
          GIT_EDITOR=true git commit -m 'Refresh published LLM question bank'
          GIT_EDITOR=true git pull --rebase origin main
          git push origin HEAD:main
