name: Android emulator gameplay smoke (mock)
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - 'backend/**'
      - '.github/workflows/android-emulator-play.yml'

permissions:
  contents: read

jobs:
  emulator-play:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      LLM_PROVIDER: mock
      SLANGVERSE_NO_LISTEN: '0'
      HOST: 127.0.0.1
      PORT: '8787'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@v4
      - name: Install Android platform for compileSdk 36
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Start test-only mock backend on emulator host bridge
        run: |
          nohup node backend/src/server.mjs > "$RUNNER_TEMP/slangverse-backend.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/slangverse-backend.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8787/api/health; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8787/api/catalog > /dev/null
      - name: Enable KVM acceleration on GitHub runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvms"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch emulator and tap through real Compose game
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set +e
            cd android
            gradle --no-daemon --stacktrace :app:connectedDebugAndroidTest
            status=$?
            cd ..
            adb shell screencap -p /sdcard/slangverse-smoke.png || true
            adb pull /sdcard/slangverse-smoke.png slangverse-emulator.png || true
            exit "$status"
      - name: Upload emulator test reports and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slangverse-emulator-playthrough-report
          path: |
            android/app/build/outputs/androidTest-results/connected/
            android/app/build/reports/androidTests/connected/
            slangverse-emulator.png
          if-no-files-found: warn
      - name: Save backend log for debugging (mock mode only)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/slangverse-backend.log" ]; then
            tail -n 75 "$RUNNER_TEMP/slangverse-backend.log"
          fi
