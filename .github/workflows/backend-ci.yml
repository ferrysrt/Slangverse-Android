name: Mock backend checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Export public-safe static demo question packs
        run: npm run bank:export
      - name: Upload static JSON demo bank
        uses: actions/upload-artifact@v4
        with:
          name: slangverse-static-demo-json
          path: backend/public-question-bank/
          if-no-files-found: error
