name: Android debug build (no Codex)
on:
  workflow_dispatch:
  push:
    branches: [main, feat/social-simulator-feed]
    paths:
      - 'android/**'
      - 'assets/profile-pictures/**'
      - 'tools/profile-pictures/**'
      - '.github/workflows/android-debug.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'assets/profile-pictures/**'
      - 'tools/profile-pictures/**'
      - '.github/workflows/android-debug.yml'

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run backend provenance, generation and publication tests
        run: npm --prefix backend test
      - name: Check default reply visibility and explicit answer controls
        run: node --test android/scripts/reply-visibility.test.mjs
      - name: Verify bundled profile pictures and generated registries
        working-directory: tools/profile-pictures
        run: npm ci && npm run check
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install required Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'
      - name: Install Gradle 8.14.3 (wrapper jar not required)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Run gameplay and social simulation unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Upload current unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-test-results
          path: android/app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - name: Assemble debug APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Upload APK artifact (only on successful build)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: slangverse-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
